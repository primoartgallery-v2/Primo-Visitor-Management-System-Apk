<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Primo Art Gallery | Staff Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --ink: #17130f;
      --cream: #f8f4ed;
      --gold: #b68a42;
      --wine: #762d32;
      --green: #287247;
      --danger: #a93232;
      --shadow: 0 20px 55px rgba(32, 23, 13, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background:
        radial-gradient(circle at 10% 10%, rgba(183, 139, 66, 0.16), transparent 32%),
        radial-gradient(circle at 90% 95%, rgba(118, 45, 50, 0.12), transparent 38%),
        var(--cream);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    button,
    input {
      font: inherit;
    }

    .app-shell {
      width: min(100%, 560px);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand {
      margin-bottom: 28px;
      text-align: center;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      margin: 0 auto 13px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--gold);
      font-size: 24px;
      font-weight: bold;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(26px, 7vw, 34px);
      font-weight: normal;
      letter-spacing: 0.04em;
    }

    .brand p {
      margin: 8px 0 0;
      color: #6d6256;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .card {
      overflow: hidden;
      border: 1px solid rgba(183, 139, 66, 0.35);
      border-radius: 20px;
      background: rgba(255, 253, 249, 0.94);
      box-shadow: var(--shadow);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .content {
      padding: 28px 24px;
    }

    h2 {
      margin: 0 0 9px;
      font-size: 26px;
      font-weight: normal;
    }

    .subtext {
      margin: 0 0 24px;
      color: #6d6256;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.55;
    }

    .pin-input {
      width: 100%;
      height: 58px;
      padding: 0 16px;
      border: 1px solid #cfc3b1;
      border-radius: 12px;
      outline: none;
      background: #fffdf9;
      color: var(--ink);
      font-family: Arial, sans-serif;
      font-size: 24px;
      letter-spacing: 0.45em;
      text-align: center;
    }

    .pin-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(183, 139, 66, 0.14);
    }

    .button-row {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .button {
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    .button:active {
      transform: scale(0.98);
    }

    .button-primary {
      background: var(--ink);
      color: #fff;
    }

    .button-secondary {
      border: 1px solid #cfc3b1;
      background: transparent;
      color: var(--ink);
    }

    .error-message {
      min-height: 20px;
      margin-top: 12px;
      color: var(--danger);
      font-family: Arial, sans-serif;
      font-size: 13px;
      text-align: center;
    }

    .scanner-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .scanner-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      background: #f3ede3;
      color: #665946;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
    }

    .status-pill.scanning .status-dot {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(40, 114, 71, 0.13);
    }

    #reader {
      width: 100%;
      min-height: 250px;
      overflow: hidden;
      border: 1px solid #d9ccb7;
      border-radius: 14px;
      background: #1c1a18;
    }

    #reader video {
      object-fit: cover !important;
    }

    #reader__dashboard {
      padding: 8px !important;
      color: #fff !important;
      font-family: Arial, sans-serif !important;
    }

    .scanner-message {
      min-height: 46px;
      margin: 16px 0 0;
      padding: 12px;
      border-radius: 10px;
      background: #f8f3ea;
      color: #665946;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .scanner-message.error {
      background: #f9e8e7;
      color: var(--danger);
    }

    .result-content {
      padding: 38px 24px 28px;
      text-align: center;
    }

    .result-icon {
      width: 74px;
      height: 74px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 35px;
      font-weight: bold;
    }

    .success {
      background: var(--green);
    }

    .already {
      background: var(--gold);
    }

    .invalid,
    .system-error {
      background: var(--wine);
    }

    .result-message {
      margin: 0;
      color: #6d6256;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    .visitor-id {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 10px;
      border-radius: 7px;
      background: #f3ede3;
      color: #5d4931;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
    }

    .footer {
      margin-top: 22px;
      color: #897b6b;
      font-family: Arial, sans-serif;
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>

        </div>
      </div>

      <div id="scannerScreen" class="screen">
        <div class="content">
          <div class="scanner-header">
            <h2>Scan visitor QR</h2>
            <div id="scannerStatus" class="status-pill">
              <span class="status-dot"></span>
              <span id="scannerStatusText">Preparing camera</span>
            </div>
          </div>

          <div id="reader"></div>

          <p id="scannerMessage" class="scanner-message">
            Please allow camera access to scan visitor QR codes.
          </p>

          <div class="button-row">
            <button id="retryCameraButton" class="button button-primary" type="button" hidden>
              Try Camera Again
            </button>
            <button id="scannerLogoutButton" class="button button-secondary" type="button">
              Logout
            </button>
          </div>
        </div>
      </div>

      <div id="resultScreen" class="screen">
        <div class="result-content">
          <div id="resultIcon" class="result-icon success">✓</div>
          <h2 id="resultTitle">Visitor checked in</h2>
          <p id="resultMessage" class="result-message"></p>
          <div id="resultVisitorId" class="visitor-id" hidden></div>

          <div class="button-row">
            <button id="scanNextButton" class="button button-primary" type="button">
              Scan Next Visitor
            </button>
            <button id="resultLogoutButton" class="button button-secondary" type="button">
              Logout
            </button>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">Primo Art Gallery · Staff Check-In</footer>
  </main>

  <script>
    (function () {
      'use strict';

      const STAFF_PIN = '2026';
      const LOGIN_STORAGE_KEY = 'primoGalleryStaffScannerLoggedIn';
      const VISITOR_ID_PATTERN = /\bPAG-2026-[A-Z0-9]{4,}\b/i;

      let html5QrCode = null;
      let scannerRunning = false;
      let processingScan = false;
      let permissionStatus = null;
      let permissionTimer = null;

      const elements = {
        loginScreen: document.getElementById('loginScreen'),
        scannerScreen: document.getElementById('scannerScreen'),
        resultScreen: document.getElementById('resultScreen'),
        pinInput: document.getElementById('pinInput'),
        loginButton: document.getElementById('loginButton'),
        loginError: document.getElementById('loginError'),
        scannerStatus: document.getElementById('scannerStatus'),
        scannerStatusText: document.getElementById('scannerStatusText'),
        scannerMessage: document.getElementById('scannerMessage'),
        retryCameraButton: document.getElementById('retryCameraButton'),
        scannerLogoutButton: document.getElementById('scannerLogoutButton'),
        resultIcon: document.getElementById('resultIcon'),
        resultTitle: document.getElementById('resultTitle'),
        resultMessage: document.getElementById('resultMessage'),
        resultVisitorId: document.getElementById('resultVisitorId'),
        scanNextButton: document.getElementById('scanNextButton'),
        resultLogoutButton: document.getElementById('resultLogoutButton')
      };

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function showScreen(name) {
        elements.loginScreen.classList.toggle('active', name === 'login');
        elements.scannerScreen.classList.toggle('active', name === 'scanner');
        elements.resultScreen.classList.toggle('active', name === 'result');
      }

      function isLoggedIn() {
        return localStorage.getItem(LOGIN_STORAGE_KEY) === 'true';
      }

      function setLoggedIn(value) {
        if (value) {
          localStorage.setItem(LOGIN_STORAGE_KEY, 'true');
        } else {
          localStorage.removeItem(LOGIN_STORAGE_KEY);
        }
      }

      function setScannerStatus(text, active) {
        elements.scannerStatusText.textContent = text;
        elements.scannerStatus.classList.toggle('scanning', Boolean(active));
      }

      function setScannerMessage(text, isError) {
        elements.scannerMessage.textContent = text;
        elements.scannerMessage.classList.toggle('error', Boolean(isError));
      }

      async function requestCameraPermission() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Camera access is not supported by this browser.');
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        stream.getTracks().forEach(function (track) {
          track.stop();
        });
      }

      async function stopScanner() {
        if (!html5QrCode || !scannerRunning) {
          return;
        }

        try {
          await html5QrCode.stop();
        } catch (error) {
          console.warn('Scanner stop warning:', error);
        }

        scannerRunning = false;
      }

      function getPreferredCamera(cameras) {
        if (!cameras || cameras.length === 0) {
          return null;
        }

        const rearCamera = cameras.find(function (camera) {
          return /back|rear|environment|external/i.test(camera.label || '');
        });

        return rearCamera || cameras[cameras.length - 1] || cameras[0];
      }

      async function startScanner() {
        if (!isLoggedIn() || scannerRunning || processingScan) {
          return;
        }

        showScreen('scanner');
        elements.retryCameraButton.hidden = true;
        setScannerStatus('Starting camera', false);
        setScannerMessage('Opening camera…', false);

        try {
          if (typeof Html5Qrcode === 'undefined') {
            throw new Error('QR scanner library could not load. Check your internet connection and reload.');
          }

          await requestCameraPermission();

          if (!html5QrCode) {
            html5QrCode = new Html5Qrcode('reader');
          }

          const cameras = await Html5Qrcode.getCameras();
          const selectedCamera = getPreferredCamera(cameras);

          if (!selectedCamera) {
            throw new Error('No camera found on this device.');
          }

          const config = {
            fps: 10,
            qrbox: { width: 240, height: 240 },
            aspectRatio: 1.0,
            disableFlip: false
          };

          await html5QrCode.start(
            selectedCamera.id,
            config,
            onQrCodeScanned,
            function () {}
          );

          scannerRunning = true;
          setScannerStatus('Scanner active', true);
          setScannerMessage('Align the visitor QR code inside the camera frame.', false);
        } catch (error) {
          scannerRunning = false;
          handleCameraError(error);
        }
      }

      function handleCameraError(error) {
        const errorName = String(error && error.name ? error.name : '');
        const errorMessage = String(error && error.message ? error.message : error || '');

        console.error('Camera error:', error);
        setScannerStatus('Camera unavailable', false);
        elements.retryCameraButton.hidden = false;

        if (
          errorName === 'NotAllowedError' ||
          /permission|denied|notallowed/i.test(errorMessage)
        ) {
          setScannerMessage(
            'Camera permission is required. Click the camera icon beside the address bar, allow access, then press Try Camera Again.',
            true
          );
          watchCameraPermission();
          return;
        }

        if (/no camera|notfound|not found/i.test(errorMessage)) {
          setScannerMessage('No camera was found. Check that your device camera is available.', true);
          return;
        }

        setScannerMessage('Camera could not start: ' + errorMessage, true);
      }

      async function watchCameraPermission() {
        if (!navigator.permissions || !navigator.permissions.query) {
          return;
        }

        try {
          permissionStatus = await navigator.permissions.query({ name: 'camera' });

          permissionStatus.onchange = function () {
            if (permissionStatus.state === 'granted' && isLoggedIn() && !scannerRunning) {
              startScanner();
            }
          };

          if (permissionTimer) {
            clearInterval(permissionTimer);
          }

          permissionTimer = setInterval(function () {
            if (
              permissionStatus &&
              permissionStatus.state === 'granted' &&
              isLoggedIn() &&
              !scannerRunning &&
              !processingScan
            ) {
              startScanner();
            }
          }, 1500);
        } catch (error) {
          console.log('Camera permission monitoring is unavailable.');
        }
      }

      function extractVisitorId(decodedText) {
        const raw = String(decodedText || '').trim();
        const directMatch = raw.match(VISITOR_ID_PATTERN);

        if (directMatch) {
          return directMatch[0].toUpperCase();
        }

        try {
          const url = new URL(raw);
          const id = url.searchParams.get('id');

          if (id && VISITOR_ID_PATTERN.test(id)) {
            return id.match(VISITOR_ID_PATTERN)[0].toUpperCase();
          }
        } catch (error) {
          const queryMatch = raw.match(/[?&]id=(PAG-2026-[A-Z0-9]{4,})\b/i);

          if (queryMatch) {
            return queryMatch[1].toUpperCase();
          }
        }

        return null;
      }

      async function onQrCodeScanned(decodedText) {
        if (processingScan) {
          return;
        }

        processingScan = true;
        const visitorId = extractVisitorId(decodedText);

        await stopScanner();

        if (!visitorId) {
          showResult(
            'invalid',
            '',
            'This QR code does not contain a valid Primo Art Gallery visitor ID.'
          );
          return;
        }

        setScannerStatus('Checking in', false);

        google.script.run
          .withSuccessHandler(function (response) {
            const result = response || {};
            const statusText = String(
              result.status || result.result || result.message || ''
            ).toLowerCase();

            let type = 'system-error';

            if (result.success === true || statusText.includes('success') || statusText.includes('checked in')) {
              type = statusText.includes('already') ? 'already' : 'success';
            } else if (statusText.includes('already')) {
              type = 'already';
            } else if (statusText.includes('invalid') || statusText.includes('not found')) {
              type = 'invalid';
            }

            showResult(
              type,
              visitorId,
              result.message || defaultMessage(type, visitorId)
            );
          })
          .withFailureHandler(function (error) {
            console.error('Check-in error:', error);
            showResult(
              'system-error',
              visitorId,
              'Unable to complete the check-in. Please try again.'
            );
          })
          .checkInVisitor(visitorId);
      }

      function defaultMessage(type, visitorId) {
        if (type === 'success') {
          return 'Visitor ' + visitorId + ' has been checked in successfully.';
        }

        if (type === 'already') {
          return 'This visitor has already been checked in.';
        }

        if (type === 'invalid') {
          return 'No visitor record was found for this QR code.';
        }

        return 'An unexpected system error occurred.';
      }

      function showResult(type, visitorId, message) {
        const details = {
          success: { icon: '✓', title: 'Visitor checked in', className: 'success' },
          already: { icon: '!', title: 'Already checked in', className: 'already' },
          invalid: { icon: '×', title: 'Invalid visitor', className: 'invalid' },
          'system-error': { icon: '!', title: 'System error', className: 'system-error' }
        };

        const setting = details[type] || details['system-error'];

        elements.resultIcon.className = 'result-icon ' + setting.className;
        elements.resultIcon.textContent = setting.icon;
        elements.resultTitle.textContent = setting.title;
        elements.resultMessage.innerHTML = escapeHtml(message);

        if (visitorId) {
          elements.resultVisitorId.textContent = visitorId;
          elements.resultVisitorId.hidden = false;
        } else {
          elements.resultVisitorId.hidden = true;
        }

        showScreen('result');
      }

      async function scanNextVisitor() {
        processingScan = false;
        await startScanner();
      }

      async function logout() {
        if (permissionTimer) {
          clearInterval(permissionTimer);
          permissionTimer = null;
        }

        processingScan = false;
        await stopScanner();

        setLoggedIn(false);
        elements.pinInput.value = '';
        elements.loginError.textContent = '';
        showScreen('login');
        elements.pinInput.focus();
      }

      async function login() {
        if (elements.pinInput.value.trim() !== STAFF_PIN) {
          elements.loginError.textContent = 'Incorrect PIN. Please try again.';
          elements.pinInput.focus();
          return;
        }

        elements.loginError.textContent = '';
        setLoggedIn(true);
        await watchCameraPermission();
        await startScanner();
      }

      elements.loginButton.addEventListener('click', login);

      elements.pinInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
          login();
        }
      });

      elements.retryCameraButton.addEventListener('click', startScanner);
      elements.scanNextButton.addEventListener('click', scanNextVisitor);
      elements.scannerLogoutButton.addEventListener('click', logout);
      elements.resultLogoutButton.addEventListener('click', logout);

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && isLoggedIn() && !scannerRunning && !processingScan) {
          startScanner();
        }
      });

      if (isLoggedIn()) {
        watchCameraPermission();
        startScanner();
      } else {
        showScreen('login');
        elements.pinInput.focus();
      }
    })();
  </script>
</body>
</html>
