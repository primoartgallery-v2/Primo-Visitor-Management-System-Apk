<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Primo Art Gallery | Dashboard<\/title>

  <style>
    :root {
      --ink: #17130f;
      --cream: #f7f3ec;
      --white: #fffdf9;
      --gold: #b68a42;
      --gold-light: #ead8b5;

      --green: #287247;
      --green-light: #e4f1e9;

      --red: #9e3838;
      --red-light: #f9e8e7;

      --yellow: #876525;
      --yellow-light: #f5eddb;

      --muted: #756b60;
      --border: #e3d8c8;
      --table-head: #f4eee5;
      --table-border: #eee5d9;

      --shadow: 0 14px 40px rgba(30, 22, 13, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(
          circle at 5% 5%,
          rgba(182, 138, 66, 0.14),
          transparent 30%
        ),
        radial-gradient(
          circle at 95% 95%,
          rgba(118, 45, 50, 0.10),
          transparent 30%
        ),
        var(--cream);

      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

     

    .login-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(182, 138, 66, 0.16),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(118, 45, 50, 0.12),
          transparent 30%
        ),
        var(--cream);
    }

    .login-card {
      width: min(430px, 100%);

      padding: 40px 34px;

      background: rgba(255, 253, 249, 0.97);

      border: 1px solid var(--border);
      border-radius: 22px;

      box-shadow:
        0 25px 70px rgba(30, 22, 13, 0.18);

      text-align: center;
    }

    .login-logo {
      width: 70px;
      height: 70px;

      margin: 0 auto 18px;

      display: grid;
      place-items: center;

      border: 1px solid var(--gold);
      border-radius: 50%;

      color: var(--gold);

      font-size: 30px;
      font-weight: bold;

      box-shadow:
        0 0 0 6px rgba(182, 138, 66, 0.06);
    }

    .login-card h1 {
      margin: 0;

      font-size: 28px;
      font-weight: normal;
    }

    .login-subtitle {
      margin: 7px 0 30px;

      color: var(--muted);

      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;

      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .login-title {
      margin-bottom: 15px;

      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
    }

    .login-card input {
      width: 100%;
      height: 49px;

      margin-bottom: 12px;
      padding: 0 14px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: white;

      outline: none;

      font-family: Arial, sans-serif;
      font-size: 14px;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .login-card input:focus {
      border-color: var(--gold);

      box-shadow:
        0 0 0 3px rgba(182, 138, 66, 0.12);
    }

    .login-button {
      width: 100%;
      height: 49px;

      margin-top: 6px;

      border: 0;
      border-radius: 10px;

      background: var(--ink);
      color: white;

      cursor: pointer;

      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: bold;

      transition:
        opacity 0.2s ease,
        transform 0.1s ease;
    }

    .login-button:hover {
      opacity: 0.92;
    }

    .login-button:active {
      transform: scale(0.98);
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .login-error {
      margin-top: 14px;

      padding: 11px;

      border-radius: 9px;

      background: var(--red-light);
      color: var(--red);

      font-family: Arial, sans-serif;
      font-size: 12px;
    }

     

    .app {
      width: min(1220px, 100%);

      margin: auto;

      padding: 28px 20px 50px;
    }

     

    .topbar {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 20px;

      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 50px;
      height: 50px;

      flex: 0 0 50px;

      border: 1px solid var(--gold);
      border-radius: 50%;

      display: grid;
      place-items: center;

      color: var(--gold);

      font-size: 23px;
      font-weight: bold;

      background: rgba(255, 253, 249, 0.7);
    }

    .brand h1 {
      margin: 0;

      font-size: 28px;

      font-weight: normal;

      letter-spacing: 0.03em;
    }

    .brand p {
      margin: 4px 0 0;

      color: var(--muted);

      font-family: Arial, sans-serif;

      font-size: 10px;

      font-weight: bold;

      letter-spacing: 0.15em;

      text-transform: uppercase;
    }

    .header-actions {
      display: flex;

      align-items: center;

      gap: 8px;

      flex-wrap: wrap;
    }

    .live-box {
      display: flex;

      align-items: center;

      gap: 8px;

      padding: 9px 13px;

      border-radius: 999px;

      background: var(--white);

      border: 1px solid var(--border);

      font-family: Arial, sans-serif;

      font-size: 11px;

      font-weight: bold;
    }

    .live-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 0 4px rgba(40, 114, 71, 0.12);

      animation: livePulse 2s infinite;
    }

    @keyframes livePulse {
      0%,
      100% {
        box-shadow:
          0 0 0 4px rgba(40, 114, 71, 0.12);
      }

      50% {
        box-shadow:
          0 0 0 7px rgba(40, 114, 71, 0.04);
      }
    }

    .header-button {
      min-height: 38px;

      padding: 0 14px;

      border: 1px solid var(--border);

      border-radius: 999px;

      background: var(--white);

      color: var(--ink);

      cursor: pointer;

      font-family: Arial, sans-serif;

      font-size: 11px;

      font-weight: bold;

      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        transform 0.1s ease;
    }

    .header-button:hover {
      border-color: var(--gold);
      background: #faf5ec;
    }

    .scanner-button {
      border-color: var(--gold);

      background: var(--ink);

      color: white;
    }

    .scanner-button:hover {
      background: var(--gold);
      color: white;
    }

    .header-button:active {
      transform: scale(0.97);
    }

     

    .stats {
      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 16px;

      margin-bottom: 22px;
    }

    .stat {
      position: relative;

      min-height: 150px;

      background: rgba(255, 253, 249, 0.94);

      border: 1px solid var(--border);

      border-radius: 17px;

      padding: 22px;

      box-shadow: var(--shadow);

      overflow: hidden;
    }

    .stat::after {
      content: "";

      position: absolute;

      right: -35px;
      bottom: -35px;

      width: 110px;
      height: 110px;

      border-radius: 50%;

      background: rgba(182, 138, 66, 0.06);
    }

    .stat-label {
      color: var(--muted);

      font-family: Arial, sans-serif;

      font-size: 11px;

      font-weight: bold;

      text-transform: uppercase;

      letter-spacing: 0.08em;
    }

    .stat-value {
      position: relative;
      z-index: 1;

      margin-top: 11px;

      font-size: 39px;

      line-height: 1;
    }

    .stat-small {
      margin-top: 9px;

      color: var(--muted);

      font-family: Arial, sans-serif;

      font-size: 11px;
    }

     

    .grid {
      display: grid;

      grid-template-columns: 1.55fr 1fr;

      gap: 20px;
    }

    .card {
      background: rgba(255, 253, 249, 0.95);

      border: 1px solid var(--border);

      border-radius: 18px;

      box-shadow: var(--shadow);

      overflow: hidden;
    }

    .card-header {
      padding: 20px 22px;

      border-bottom: 1px solid var(--border);

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 12px;
    }

    .card-header h2 {
      margin: 0;

      font-size: 20px;

      font-weight: normal;
    }

    .card-header span {
      color: var(--muted);

      font-family: Arial, sans-serif;

      font-size: 11px;
    }

    .card-body {
      padding: 20px;
    }

     

    .search {
      width: 100%;

      height: 46px;

      padding: 0 14px;

      border: 1px solid var(--border);

      border-radius: 10px;

      background: #fff;

      outline: none;

      font-family: Arial, sans-serif;

      font-size: 14px;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .search:focus {
      border-color: var(--gold);

      box-shadow:
        0 0 0 3px rgba(182, 138, 66, 0.12);
    }

     

    .table-wrap {
      overflow-x: auto;

      margin-top: 16px;

      border: 1px solid var(--table-border);

      border-radius: 10px;
    }

    table {
      width: 100%;

      min-width: 760px;

      border-collapse: collapse;

      font-family: Arial, sans-serif;

      font-size: 13px;
    }

    th {
      padding: 12px 10px;

      background: var(--table-head);

      color: #665946;

      text-align: left;

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: 0.05em;

      white-space: nowrap;
    }

    td {
      padding: 13px 10px;

      border-bottom: 1px solid var(--table-border);

      white-space: nowrap;
    }

    tbody tr:hover {
      background: #fcfaf6;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .id {
      font-weight: bold;

      color: #5d4931;
    }

    .badge {
      display: inline-flex;

      align-items: center;

      gap: 5px;

      padding: 5px 9px;

      border-radius: 999px;

      font-size: 10px;

      font-weight: bold;
    }

    .badge-success {
      background: var(--green-light);

      color: var(--green);
    }

    .badge-pending {
      background: var(--yellow-light);

      color: var(--yellow);
    }

     

    .recent-item {
      display: flex;

      justify-content: space-between;

      gap: 12px;

      padding: 14px 0;

      border-bottom: 1px solid var(--table-border);
    }

    .recent-item:last-child {
      border-bottom: 0;
    }

    .recent-name {
      font-family: Arial, sans-serif;

      font-size: 14px;

      font-weight: bold;
    }

    .recent-id {
      margin-top: 4px;

      color: #876d46;

      font-family: Arial, sans-serif;

      font-size: 11px;
    }

    .recent-time {
      color: var(--muted);

      font-family: Arial, sans-serif;

      font-size: 11px;

      text-align: right;

      white-space: nowrap;
    }

     

    .progress-box {
      margin-top: 4px;
    }

    .progress-label {
      display: flex;

      justify-content: space-between;

      margin-bottom: 8px;

      font-family: Arial, sans-serif;

      font-size: 12px;

      font-weight: bold;
    }

    .progress {
      height: 10px;

      overflow: hidden;

      border-radius: 999px;

      background: #eadfce;
    }

    .progress-bar {
      height: 100%;

      width: 0%;

      background: var(--green);

      border-radius: inherit;

      transition: width 0.4s ease;
    }

     

    .button-row {
      display: flex;

      gap: 10px;

      flex-wrap: wrap;
    }

    .button {
      border: 0;

      border-radius: 10px;

      min-height: 42px;

      padding: 0 15px;

      cursor: pointer;

      font-family: Arial, sans-serif;

      font-size: 12px;

      font-weight: bold;

      transition:
        opacity 0.2s ease,
        transform 0.1s ease;
    }

    .button:hover {
      opacity: 0.9;
    }

    .button:active {
      transform: scale(0.98);
    }

    .button:disabled {
      opacity: 0.6;

      cursor: wait;
    }

    .button-primary {
      background: var(--ink);

      color: #fff;
    }

    .button-secondary {
      background: #f2eadf;

      color: var(--ink);
    }

     

    .loading {
      text-align: center;

      padding: 45px 15px;

      color: var(--muted);

      font-family: Arial, sans-serif;

      font-size: 13px;
    }

    .empty {
      padding: 40px 15px;

      text-align: center;

      color: var(--muted);

      font-family: Arial, sans-serif;

      font-size: 13px;
    }

    .error {
      margin: 18px 0;

      padding: 13px;

      border-radius: 10px;

      background: var(--red-light);

      color: var(--red);

      font-family: Arial, sans-serif;

      font-size: 13px;
    }

    .footer {
      margin-top: 25px;

      color: #897b6b;

      font-family: Arial, sans-serif;

      font-size: 11px;

      text-align: center;
    }

     

    @media (max-width: 950px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .app {
        padding: 18px 12px 35px;
      }

      .topbar {
        align-items: flex-start;

        flex-direction: column;
      }

      .header-actions {
        width: 100%;
      }

      .live-box,
      .header-button {
        flex: 1;

        justify-content: center;

        text-align: center;
      }

      .stats {
        grid-template-columns: 1fr 1fr;

        gap: 10px;
      }

      .stat {
        min-height: 125px;

        padding: 16px;
      }

      .stat-value {
        font-size: 30px;
      }

      .brand h1 {
        font-size: 22px;
      }

      .brand p {
        font-size: 9px;
      }

      .card-header {
        padding: 17px;
      }

      .card-body {
        padding: 15px;
      }

      .button {
        flex: 1;
      }
    }
  <\/style>
<\/head>

  <script>

    


    let visitors = [];

    let dashboardToken = null;

    let refreshTimer = null;

    let isLoadingDashboard = false;


    


    const searchInput =
      document.getElementById(
        "searchInput"
      );


    


    function escapeHtml(value) {

      return String(
        value == null ? "" : value
      )
        .replace(/&/g, "&amp;")
        .replace(/<\/g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    


    function isVisitorCheckedIn(visitor) {

      const status =
        String(
          visitor &&
          visitor.status
            ? visitor.status
            : ""
        )
          .trim()
          .toLowerCase();


      return (
        status === "checked in" ||
        status === "checked-in" ||
        status === "checkedin" ||
        status === "present" ||
        status.includes("checked")
      );
    }


    


    function performLogin() {

      const username =
        document
          .getElementById(
            "loginUsername"
          )
          .value
          .trim();


      const password =
        document
          .getElementById(
            "loginPassword"
          )
          .value;


      const errorBox =
        document.getElementById(
          "loginError"
        );


      const button =
        document.getElementById(
          "loginButton"
        );


      errorBox.innerHTML = "";


      if (!username || !password) {

        errorBox.innerHTML =
          '<div class="login-error">' +
          'Please enter User ID and Password.' +
          '<\/div>';

        return;
      }


      button.disabled = true;

      button.textContent =
        "Logging in...";


      google.script.run

        .withSuccessHandler(
          function(result) {

            button.disabled = false;

            button.textContent =
              "Login";


            if (
              !result ||
              result.success !== true
            ) {

              errorBox.innerHTML =
                '<div class="login-error">' +
                escapeHtml(
                  result &&
                  result.message
                    ? result.message
                    : "Login failed."
                ) +
                "<\/div>";

              return;
            }


            if (!result.token) {

              errorBox.innerHTML =
                '<div class="login-error">' +
                "Login succeeded but no session token was returned." +
                "<\/div>";

              return;
            }


            dashboardToken =
              result.token;


            sessionStorage.setItem(
              "primo_dashboard_token",
              dashboardToken
            );


            showDashboard();

            loadExhibitions();

            startAutoRefresh();

          }
        )

        .withFailureHandler(
          function(error) {

            button.disabled = false;

            button.textContent =
              "Login";


            console.error(
              "Login error:",
              error
            );


            errorBox.innerHTML =
              '<div class="login-error">' +
              "Unable to connect to login system." +
              "<\/div>";

          }
        )

        .loginDashboard(
          username,
          password
        );

    }


    


    function showDashboard() {

      document
        .getElementById(
          "loginScreen"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "dashboardApp"
        )
        .style.display =
        "block";

    }


    


    function loadDashboard() {

      if (!dashboardToken) {
        return;
      }


      if (isLoadingDashboard) {
        return;
      }


      isLoadingDashboard = true;


      const refreshButton =
        document.getElementById(
          "refreshButton"
        );


      const originalText =
        refreshButton
          ? refreshButton.textContent
          : "Refresh Now";


      if (refreshButton) {

        refreshButton.disabled = true;

        refreshButton.textContent =
          "Refreshing...";

      }


      document
        .getElementById(
          "errorBox"
        )
        .innerHTML = "";


      google.script.run

        .withSuccessHandler(
          function(data) {

            isLoadingDashboard = false;


            if (refreshButton) {

              refreshButton.disabled =
                false;

              refreshButton.textContent =
                originalText;

            }


            if (
              !data ||
              data.success !== true
            ) {

              if (
                data &&
                data.unauthorized
              ) {

                forceLogout(
                  data.message ||
                  "Dashboard session expired."
                );

                return;
              }


              showError(
                data &&
                data.message
                  ? data.message
                  : "Unable to load dashboard data."
              );

              return;
            }


            if (data.data) data = Object.assign({}, data.data, { success: true });

            visitors =
              Array.isArray(
                data.visitors
              )
                ? data.visitors
                : [];


            updateStats(data);

            renderVisitors(
              getCurrentFilteredVisitors()
            );

            renderRecent(
              visitors
            );


            document
              .getElementById(
                "lastUpdated"
              )
              .textContent =
                "Updated " +
                new Date()
                  .toLocaleTimeString();

          }
        )

        .withFailureHandler(
          function(error) {

            isLoadingDashboard = false;


            if (refreshButton) {

              refreshButton.disabled =
                false;

              refreshButton.textContent =
                originalText;

            }


            console.error(
              "Dashboard error:",
              error
            );


            showError(
              "Unable to connect to the visitor management system."
            );

          }
        )

        .getDashboardDataByExhibition(dashboardToken, document.getElementById("exhibitionFilter").value);

    }


    


    function updateStats(data) {

      const total =
        Number(
          data.total || 0
        );


      const checkedIn =
        Number(
          data.checkedIn || 0
        );


      const pending =
        Number(
          data.pending || 0
        );


      let rate =
        Number(
          data.rate || 0
        );


      if (
        total > 0 &&
        (
          data.rate === undefined ||
          data.rate === null ||
          data.rate === ""
        )
      ) {

        rate =
          (
            checkedIn /
            total
          ) *
          100;

      }


      if (
        !Number.isFinite(rate)
      ) {

        rate = 0;

      }


      rate =
        Math.min(
          100,
          Math.max(
            0,
            rate
          )
        );


      rate =
        Math.round(
          rate * 10
        ) / 10;


      document
        .getElementById(
          "totalVisitors"
        )
        .textContent =
        total;


      document
        .getElementById(
          "checkedIn"
        )
        .textContent =
        checkedIn;


      document
        .getElementById(
          "pending"
        )
        .textContent =
        pending;


      document
        .getElementById(
          "checkinRate"
        )
        .textContent =
        rate + "%";


      document
        .getElementById(
          "progressText"
        )
        .textContent =
        rate + "%";


      document
        .getElementById(
          "progressBar"
        )
        .style.width =
        rate + "%";

    }

    function renderRecent(list) {

      const container =
        document.getElementById(
          "recentContainer"
        );


      const checkedIn =
        (
          Array.isArray(list)
            ? list
            : []
        )

          .filter(
            function(visitor) {

              return isVisitorCheckedIn(
                visitor
              );

            }
          )

          .sort(
            function(a, b) {

              return (
                getTimeValue(
                  b.checkInTime
                ) -
                getTimeValue(
                  a.checkInTime
                )
              );

            }
          )

          .slice(
            0,
            8
          );


      if (!checkedIn.length) {

        container.innerHTML =
          '<div class="empty">' +
          "No check-ins yet." +
          "<\/div>";

        return;
      }


      let html = "";


      checkedIn.forEach(
        function(visitor) {

          html +=
            '<div class="recent-item">' +

            "<div>" +

            '<div class="recent-name">' +
            escapeHtml(
              visitor.name ||
              "Visitor"
            ) +
            "<\/div>" +

            '<div class="recent-id">' +
            escapeHtml(
              visitor.visitorId ||
              ""
            ) +
            "<\/div>" +

            "<\/div>" +

            '<div class="recent-time">' +
            escapeHtml(
              visitor.checkInTime ||
              ""
            ) +
            "<\/div>" +

            "<\/div>";

        }
      );


      container.innerHTML =
        html;

    }


    


    function getTimeValue(value) {

      if (!value) {
        return 0;
      }


      const direct =
        new Date(value);


      if (
        !Number.isNaN(
          direct.getTime()
        )
      ) {

        return direct.getTime();

      }


      const text =
        String(value)
          .trim();


      const match =
        text.match(
          /^(\\d{1,2})[\\/-](\\d{1,2})[\\/-](\\d{4})\\s+(\\d{1,2}):(\\d{2})(?::(\\d{2}))?$/
        );


      if (!match) {
        return 0;
      }


      const day =
        Number(match[1]);


      const month =
        Number(match[2]) - 1;


      const year =
        Number(match[3]);


      const hour =
        Number(match[4]);


      const minute =
        Number(match[5]);


      const second =
        Number(match[6] || 0);


      return new Date(
        year,
        month,
        day,
        hour,
        minute,
        second
      ).getTime();

    }


    


    function getCurrentFilteredVisitors() {

      const query =
        searchInput
          ? searchInput.value
              .trim()
              .toLowerCase()
          : "";


      if (!query) {
        return visitors;
      }


      return visitors.filter(
        function(visitor) {

          return [

            visitor.visitorId,

            visitor.name,

            visitor.phone,

            visitor.email,

            visitor.city,

            visitor.status,

            visitor.checkInTime

          ]

            .map(
              function(value) {

                return value == null
                  ? ""
                  : String(value);

              }
            )

            .join(" ")

            .toLowerCase()

            .includes(
              query
            );

        }
      );

    }


    if (searchInput) {

      searchInput.addEventListener(
        "input",
        function() {

          renderVisitors(
            getCurrentFilteredVisitors()
          );

        }
      );

    }


    


    function openScanner() {

      if (!dashboardToken) {

        showError(
          "Dashboard session is not active. Please login again."
        );

        return;
      }


      document
        .getElementById(
          "errorBox"
        )
        .innerHTML = "";


      


      google.script.run
        .withSuccessHandler(function(result) {
          if (!result || !result.success || !result.data || !result.data.token) {
            showError(result && result.message ? result.message : "Unable to prepare scanner access.");
            return;
          }
          
          
          const scannerWindow = window.open("https://primo-art-gallery-vms.web.app/#scannerSession=" + encodeURIComponent(result.data.token), "_blank");
          if (!scannerWindow) showError("Scanner could not be opened. Please allow pop-ups for this site.");
        })
        .withFailureHandler(function() { showError("Unable to prepare scanner access."); })
        .createScannerSession(dashboardToken);

    }


    

    function loadExhibitions() {
      if (!dashboardToken) return;
      google.script.run.withSuccessHandler(function(result) {
        if (!result || !result.success) { showError(result && result.message || "Unable to load exhibitions."); return; }
        const exhibitions = result.data || [];
        const select = document.getElementById("exhibitionFilter");
        select.innerHTML = exhibitions.filter(function(x) { return x.status === "Active"; }).map(function(x) {
          return '<option value="' + escapeHtml(x.exhibitionId) + '">' + escapeHtml(x.exhibitionName + " \u2014 " + x.venue) + '<\/option>';
        }).join("");
        document.getElementById("exhibitionList").innerHTML = exhibitions.map(function(x) {
          const isActive = x.status === "Active";
          return '<div style="border-top:1px solid #ece7df;padding:10px 0"><strong>' + escapeHtml(x.exhibitionName) + '<\/strong><br><small>' + escapeHtml(x.exhibitionId + " · " + x.venue + " · " + x.startDate + " \u2014 " + x.endDate + " · " + x.status) + '<\/small><br><button class="button button-secondary" style="margin-top:7px" onclick="editExhibition(' + JSON.stringify(JSON.stringify(x)).replace(/&/g, "&amp;") + ')">Edit<\/button> <button class="button button-secondary" style="margin-top:7px" onclick="toggleExhibitionStatus(\'' + escapeHtml(x.exhibitionId) + '\',\'' + (isActive ? "Inactive" : "Active") + '\')">' + (isActive ? "Deactivate" : "Activate") + '<\/button><\/div>';
        }).join("") || '<div class="empty">No exhibitions yet.<\/div>';
        google.script.run.withSuccessHandler(function(current) {
          if (current && current.success && current.data) {
            select.value = current.data.exhibitionId;
            document.getElementById("currentExhibitionMeta").textContent = current.data.venue + " · " + current.data.startDate + " \u2014 " + current.data.endDate;
            loadDashboard();
          }
        }).getCurrentExhibition();
      }).getExhibitions(dashboardToken);
    }
    function changeCurrentExhibition() {
      google.script.run.withSuccessHandler(function(result) { if (!result || !result.success) return showError(result && result.message || "Unable to set exhibition."); document.getElementById("currentExhibitionMeta").textContent = result.data.venue + " · " + result.data.startDate + " \u2014 " + result.data.endDate; loadDashboard(); }).setCurrentExhibition(dashboardToken, document.getElementById("exhibitionFilter").value);
    }
    function saveExhibition(event) {
      event.preventDefault();
      const data = { exhibitionId: document.getElementById("editExhibitionId").value, exhibitionName: document.getElementById("exhibitionName").value, venue: document.getElementById("exhibitionVenue").value, startDate: document.getElementById("exhibitionStart").value, endDate: document.getElementById("exhibitionEnd").value, status: "Active" };
      const method = data.exhibitionId ? "updateExhibition" : "createExhibition";
      google.script.run.withSuccessHandler(function(result) { if (!result || !result.success) return showError(result && result.message || "Unable to save exhibition."); clearExhibitionForm(); loadExhibitions(); }).withFailureHandler(function() { showError("Unable to save exhibition."); })[method](dashboardToken, data);
    }
    function editExhibition(encoded) { const x = JSON.parse(encoded); document.getElementById("editExhibitionId").value = x.exhibitionId; document.getElementById("exhibitionName").value = x.exhibitionName; document.getElementById("exhibitionVenue").value = x.venue; document.getElementById("exhibitionStart").value = String(x.startDate).slice(0, 10); document.getElementById("exhibitionEnd").value = String(x.endDate).slice(0, 10); }
    function clearExhibitionForm() { document.getElementById("exhibitionForm").reset(); document.getElementById("editExhibitionId").value = ""; }
    function toggleExhibitionStatus(id, status) { google.script.run.withSuccessHandler(function(result) { if (!result || !result.success) return showError(result && result.message || "Unable to update exhibition."); loadExhibitions(); }).setExhibitionStatus(dashboardToken, id, status); }

    function forceLogout(message) {

      stopAutoRefresh();


      dashboardToken =
        null;


      isLoadingDashboard =
        false;


      sessionStorage.removeItem(
        "primo_dashboard_token"
      );


      visitors = [];


      document
        .getElementById(
          "dashboardApp"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "loginScreen"
        )
        .style.display =
        "flex";


      document
        .getElementById(
          "loginUsername"
        )
        .value = "";


      document
        .getElementById(
          "loginPassword"
        )
        .value = "";


      document
        .getElementById(
          "loginError"
        )
        .innerHTML =
        '<div class="login-error">' +

          message ||
          "Your dashboard session has expired. Please login again."

    function startAutoRefresh() {

      stopAutoRefresh();


      refreshTimer =
        setInterval(
          function() {

            if (dashboardToken) {

              loadDashboard();

            }

          },
          10000
        );

    }


    function stopAutoRefresh() {

      if (refreshTimer) {

        clearInterval(
          refreshTimer
        );

        refreshTimer =
          null;

      }

    }


    


    function showError(message) {

      document
        .getElementById(
          "errorBox"
        )
        .innerHTML =
        '<div class="error">' +
        escapeHtml(
          message
        ) +
        "<\/div>";

    }


    


    function restoreSession() {

      const savedToken =
        sessionStorage.getItem(
          "primo_dashboard_token"
        );


      if (!savedToken) {
        return;
      }


      dashboardToken =
        savedToken;


      google.script.run

        .withSuccessHandler(
          function(result) {

            if (
              !result ||
              result.success !== true
            ) {

              forceLogout(
                "Your dashboard session has expired. Please login again."
              );

              return;
            }


            showDashboard();

            loadExhibitions();

            startAutoRefresh();

          }
        )

        .withFailureHandler(
          function(error) {

            console.error(
              "Session validation error:",
              error
            );


            forceLogout(
              "Unable to validate your dashboard session. Please login again."
            );

          }
        )

        .isDashboardSessionValid(
          savedToken
        );

    }


    


    document
      .getElementById(

      )
      .addEventListener(

          if (
            event.key === "Enter"
          ) {

            performLogin();

          }

        }
      );


    document
      .getElementById(
        "loginUsername"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            performLogin();

          }

        }
      );


    


    restoreSession();
